[workspace]
resolver = "2"
members = [
  "crates/vpr-domain",
  "crates/vpr-policy",
  "crates/vpr-integration",
  "crates/vpr-capture",
  "crates/vpr-runtime",
  "crates/vpr-provider-openai-compatible",
  "crates/vpr-provider-openai-transcription",
  "crates/vpr-provider-deepgram-stt",
  "crates/vpr-provider-anthropic",
  "crates/vpr-provider-gemini",
  "crates/vpr-provider-openai-speech",
  "crates/vpr-provider-elevenlabs-tts",
  "crates/vpr-provider-did-agent-streams",
  "crates/vpr-owner-lab",
  "crates/vpr-rt0-smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

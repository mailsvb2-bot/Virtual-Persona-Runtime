[workspace]
resolver = "2"
members = [
  "crates/vpr-domain",
  "crates/vpr-policy",
  "crates/vpr-integration",
  "crates/vpr-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

name: Bootstrap locked LiveKit vendor

on:
  push:
    branches: [hardening/self-host-livekit-20261001]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/vpr-owner-lab/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hardening/self-host-livekit-20261001
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: crates/vpr-owner-lab/ui/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate UI and locked LiveKit vendor asset
        run: npm run build
      - name: Commit generated bytes
        working-directory: .
        run: |
          git add crates/vpr-owner-lab/ui/dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: vendor locked LiveKit browser SDK"
          git push origin HEAD:hardening/self-host-livekit-20261001

name: Temporary Rust TLS Lock Refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve and encode Cargo.lock for reviewed update
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p tungstenite --precise 0.26.2
          python3 - <<'PY'
          import base64, gzip, pathlib
          content=pathlib.Path("Cargo.lock").read_bytes()
          encoded=base64.b64encode(gzip.compress(content)).decode()
          print("CARGO_LOCK_GZIP_START")
          for i in range(0,len(encoded),180):
              print(encoded[i:i+180])
          print("CARGO_LOCK_GZIP_END")
          PY

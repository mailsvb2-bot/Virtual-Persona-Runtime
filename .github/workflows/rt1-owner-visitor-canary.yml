name: RT1 owner-visitor real RTP integration

on:
  pull_request:
    paths:
      - 'crates/vpr-owner-lab/**'
      - 'crates/vpr-runtime/**'
      - 'crates/vpr-provider-local-open-source/**'
      - 'scripts/rt1_*'
      - 'tests/e2e/run_rt1_*'
      - '.github/workflows/rt1-owner-visitor-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rt1-owner-visitor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-owner-visitor-rtp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: crates/vpr-owner-lab/ui/package-lock.json
      - name: Install actual WebRTC transport
        run: python -m pip install 'aiortc>=1.10,<2'
      - name: Install UI dependencies
        working-directory: crates/vpr-owner-lab/ui
        run: npm ci --ignore-scripts
      - name: Build embedded browser assets
        working-directory: crates/vpr-owner-lab/ui
        run: npm run build
      - name: Build Owner Lab
        run: cargo build --locked -p vpr-owner-lab --bin vpr-owner-lab
      - name: Install Chromium
        working-directory: crates/vpr-owner-lab/ui
        run: npx playwright install --with-deps chromium
      - name: Real owner publication, separate visitor RTP, revoked dual-track STOP
        working-directory: crates/vpr-owner-lab/ui
        run: npx playwright test --config playwright.rt1.config.ts

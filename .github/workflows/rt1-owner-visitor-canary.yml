name: RT1 owner-visitor browser safety (local RTP fixtures)

on:
  pull_request:
    paths:
      - 'crates/vpr-owner-lab/**'
      - 'crates/vpr-runtime/**'
      - 'crates/vpr-provider-local-open-source/**'
      - 'scripts/rt1_*'
      - 'tests/e2e/run_rt1_*'
      - 'tests/architecture/test_rt1_browser_action_routes.py'
      - '.github/workflows/rt1-owner-visitor-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rt1-owner-visitor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-owner-visitor-rtp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: crates/vpr-owner-lab/ui/package-lock.json
      - name: Install actual WebRTC transport
        run: python -m pip install 'aiortc>=1.10,<2' 'numpy>=1.26,<3'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain uninstall 1.88.0 || true
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          rustc --version
      - name: Install UI dependencies
        working-directory: crates/vpr-owner-lab/ui
        run: npm ci --ignore-scripts
      - name: Build embedded browser assets
        working-directory: crates/vpr-owner-lab/ui
        run: npm run build
      - name: Build Owner Lab
        run: cargo build --locked -p vpr-owner-lab --bin vpr-owner-lab
      - name: Install Chromium
        working-directory: crates/vpr-owner-lab/ui
        run: npx playwright install chromium
      - name: Browser owner publication rejects diagnostic video transport
        working-directory: crates/vpr-owner-lab/ui
        run: npx playwright test --config playwright.rt1.config.ts
      - name: RT1 visitor microphone to STT/LLM/TTS and RTP STOP (synthetic renderer; not D-ID)
        working-directory: crates/vpr-owner-lab/ui
        run: |
          # Each owner journey provisions a fresh in-memory workspace. Restart the
          # real HTTP/worker fixtures between journeys instead of sharing one
          # publication and accidentally testing a second provision against it.
          VPR_RT1_E2E_PERSONA_ID=rt1-local-canary-persona npx playwright test --config playwright.rt1.voice.config.ts e2e/rt1-worker-owner-visitor-isolation.spec.ts
          VPR_RT1_E2E_PERSONA_ID=rt1-worker-voice-browser-e2e npx playwright test --config playwright.rt1.voice.config.ts e2e/rt1-worker-voice-journey.spec.ts
          npx playwright test --config playwright.rt1.voice.config.ts e2e/rt1-late-livekit-connect.spec.ts e2e/rt1-late-microphone-revoke.spec.ts e2e/rt1-voice-inflight-stop.spec.ts
      - name: D-ID-shaped provider fixture safety and unconfirmed STOP (not live D-ID)
        working-directory: crates/vpr-owner-lab/ui
        run: npx playwright test --config playwright.rt1.canonical.config.ts

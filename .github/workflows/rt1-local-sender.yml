name: RT1 local sender lifecycle and real RTP

on:
  pull_request:
    paths:
      - 'scripts/rt1_aiortc_backend.py'
      - 'scripts/rt1_musetalk_renderer.py'
      - 'scripts/rt1_musetalk_offline_preflight.py'
      - 'scripts/rt1_musetalk_environment.py'
      - 'scripts/rt1_media_worker_*.py'
      - 'tests/e2e/test_rt1_*.py'
      # RT1 conversation/egress changes must re-run the actual worker lifecycle,
      # cancellation, durable STOP reconciliation and dual-track RTP probe.
      - 'crates/vpr-owner-lab/src/rt1_*.rs'
      - 'crates/vpr-owner-lab/src/http_rt1*.rs'
      # The public RT1 socket and the internal Owner Lab listener are one
      # revocable transport boundary; changes here must rerun sender STOP.
      - 'crates/vpr-owner-lab/src/http_proxy.rs'
      - 'crates/vpr-owner-lab/src/startup.rs'
      - 'crates/vpr-owner-lab/src/main.rs'
      - 'crates/vpr-runtime/src/cancellable_tcp_writer.rs'
      - 'crates/vpr-provider-local-open-source/src/operation_client.rs'
      - '.github/workflows/rt1-local-sender.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rt1-local-sender:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install actual WebRTC transport
        run: python -m pip install 'aiortc>=1.10,<2' 'numpy>=1.26,<3'
      - name: Worker lifecycle, cancellation, STOP and HTTP tests
        run: |
          for test in \
            test_rt1_media_worker_lifecycle.py \
            test_rt1_media_worker_http.py \
            test_rt1_worker_http_shutdown.py \
            test_rt1_media_signaling_http.py \
            test_rt1_bounded_create.py \
            test_rt1_stop_reconciler.py \
            test_rt1_ice_configuration.py \
            test_rt1_aiortc_backend_timeout.py \
            test_rt1_musetalk_renderer.py \
            test_rt1_musetalk_asset_digest.py \
            test_rt1_musetalk_offline_preflight.py \
            test_rt1_musetalk_environment.py \
            test_rt1_musetalk_gpu_acceptance.py \
            test_rt1_webrtc_rtp_revoke.py; do
            python "tests/e2e/$test" -v
          done

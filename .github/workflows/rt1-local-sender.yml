name: RT1 local sender lifecycle and real RTP

on:
  pull_request:
    paths:
      - 'scripts/rt1_aiortc_backend.py'
      - 'scripts/rt1_media_worker_*.py'
      - 'tests/e2e/test_rt1_*.py'
      - '.github/workflows/rt1-local-sender.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rt1-local-sender:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install actual WebRTC transport
        run: python -m pip install 'aiortc>=1.10,<2'
      - name: Worker lifecycle, cancellation, STOP and HTTP tests
        run: |
          for test in \
            test_rt1_media_worker_lifecycle.py \
            test_rt1_media_worker_http.py \
            test_rt1_media_signaling_http.py \
            test_rt1_bounded_create.py \
            test_rt1_stop_reconciler.py \
            test_rt1_ice_configuration.py \
            test_rt1_aiortc_backend_timeout.py \
            test_rt1_webrtc_rtp_revoke.py; do
            python "tests/e2e/$test" -v
          done

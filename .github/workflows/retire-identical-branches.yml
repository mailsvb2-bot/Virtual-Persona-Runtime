name: Retire content-identical historical branches

on:
  # Delete only after the actual current main passes all CI gates, not when
  # an unrelated cleanup file changes or a PR proves only its own checks.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: vpr-identical-branch-retirement
  cancel-in-progress: false

jobs:
  retire-identical:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Require exact current main SHA from successful CI
        id: current
        env:
          VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          live_sha="$(git ls-remote --heads origin refs/heads/main | cut -f1)"
          checked_out="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]] && \
             { [[ "${VERIFIED_CI_SHA}" != "${live_sha}" ]] || \
               [[ "${VERIFIED_CI_SHA}" != "${checked_out}" ]]; }; then
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::A newer main superseded the successful CI; do not retire branches"
          elif [[ "${checked_out}" != "${live_sha}" ]]; then
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::The checked-out main differs from remote main"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Test fail-closed branch retirement invariants
        if: steps.current.outputs.run == 'true'
        run: python3 -m unittest discover -s tests/architecture -p 'test_branch_retirement.py'
      - name: Verify exact main SHA and retire identical branch trees
        if: steps.current.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            python3 scripts/retire_identical_branches.py --execute \
              --expected-main-sha "${VERIFIED_CI_SHA}" --out branch-retirement
          else
            python3 scripts/retire_identical_branches.py --execute --out branch-retirement
          fi
      - name: Preserve immutable branch-head inventory and deletion outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branch-retirement-inventory
          path: branch-retirement/
          retention-days: 90
          if-no-files-found: warn

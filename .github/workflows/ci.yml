name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Architecture boundaries
        run: python3 tests/architecture/check_boundaries.py
      - name: Release contracts
        run: python3 tests/architecture/check_release_contracts.py
      - name: RT1 publication pre-entry spike
        run: python3 tests/architecture/check_rt1_publication_spike.py
      - name: RT1 public session lease pre-entry spike
        run: python3 tests/architecture/check_rt1_public_session_lease_spike.py
      - name: RT1 persistence pre-entry spike
        run: python3 tests/architecture/check_rt1_persistence_spike.py
      - name: RT1 workspace authority pre-entry spike
        run: python3 tests/architecture/check_rt1_workspace_authority_spike.py
      - name: RT1 owner claim lifecycle pre-entry spike
        run: python3 tests/architecture/check_rt1_owner_claim_lifecycle_spike.py
      - name: RT1 behavior training pre-entry spike
        run: python3 tests/architecture/check_rt1_behavior_training_spike.py
      - name: RT1 Answer Evidence Card pre-entry spike
        run: python3 tests/architecture/check_rt1_answer_evidence_card_spike.py
      - name: RT1 cost and hard-budget pre-entry spike
        run: python3 tests/architecture/check_rt1_cost_budget_spike.py
      - name: RT1 Preparation Plane pre-entry spike
        run: python3 tests/architecture/check_rt1_preparation_plane_spike.py
      - name: RT1 voice and appearance identity pre-entry spike
        run: python3 tests/architecture/check_rt1_voice_appearance_identity_spike.py
      - name: RT1 Persona lifecycle pre-entry spike
        run: python3 tests/architecture/check_rt1_persona_lifecycle_spike.py
      - name: RT1 consent and rights pre-entry spike
        run: python3 tests/architecture/check_rt1_consent_rights_spike.py
      - name: RT1 Owner Control Center pre-entry spike
        run: python3 tests/architecture/check_rt1_owner_control_center_spike.py
      - name: RT1 capture and import pre-entry spike
        run: python3 tests/architecture/check_rt1_capture_import_spike.py
      - name: RT1 API boundary pre-entry spike
        run: python3 tests/architecture/check_rt1_api_boundary_spike.py
      - name: RT1 reason-code UI pre-entry spike
        run: python3 tests/architecture/check_rt1_reason_ui_spike.py
      - name: RT1 owner audit pre-entry spike
        run: python3 tests/architecture/check_rt1_owner_audit_spike.py
      - name: RT1 release evidence pre-entry spike
        run: python3 tests/architecture/check_rt1_release_evidence_spike.py
      - name: RT1 private Persona deletion pre-entry spike
        run: python3 tests/architecture/check_rt1_persona_deletion_spike.py
      - name: Owner Lab browser contract guard
        run: python3 tests/architecture/check_browser_contract.py
      - name: Lockfile consistency
        run: cargo check --workspace --all-targets --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets
      - name: Owner Lab Persona full process restart E2E
        run: |
          cargo build --locked -p vpr-owner-lab --bin vpr-owner-lab
          python3 tests/e2e/test_owner_lab_persona_restart.py


  windows-owner-lab-credentials:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Compile Windows credential path
        run: cargo check --locked -p vpr-owner-lab --all-targets
      - name: Windows owner-lab library tests
        run: cargo test --locked -p vpr-owner-lab --lib

  owner-lab-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/vpr-owner-lab/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/vpr-owner-lab/ui/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Generated bundle is current
        run: git diff --exit-code -- dist/app.js dist/owner-capture.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser contract E2E
        run: npm run test:e2e

  owner-lab-ui-backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/vpr-owner-lab/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/vpr-owner-lab/ui/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Backend-integrated browser E2E
        run: npm run test:e2e:backend

  owner-lab-ui-voice-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/vpr-owner-lab/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/vpr-owner-lab/ui/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Backend-integrated voice browser E2E
        run: npm run test:e2e:voice

  owner-lab-ui-expressive-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/vpr-owner-lab/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/vpr-owner-lab/ui/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Backend-integrated Expressive LiveKit E2E
        run: npm run test:e2e:expressive

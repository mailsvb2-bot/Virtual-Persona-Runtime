name: Temporary Owner UI Rebuild
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - name: Build TypeScript and capture generated app
        working-directory: crates/vpr-owner-lab/ui
        run: |
          npm ci --ignore-scripts
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          content=Path("dist/app.js").read_text()
          print("VPR_UI_BUILD_BEGIN")
          print(content, end="")
          print("VPR_UI_BUILD_END")
          PY

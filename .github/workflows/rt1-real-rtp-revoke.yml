name: RT1 actual WebRTC RTP revoke probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rt1-rtp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-real-rtp:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install real WebRTC transport
        run: python -m pip install 'aiortc>=1.10,<2'
      - name: Negotiate and revoke actual audio/video RTP
        run: python tests/e2e/test_rt1_webrtc_rtp_revoke.py -v
